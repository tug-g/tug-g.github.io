<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Pannel</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, textarea { width: 100%; margin: 8px 0; padding: 8px; }
    button { padding: 10px 15px; cursor: pointer; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>Admin Pannel</h1>
  <p>Add a Post or Extra</p>

  <label>GitHub Token:</label>
  <input type="password" id="token" placeholder="ghp_XXXXXXXXXXXXXXXXXXXXXXXX" />

  <label>Title:</label>
  <input id="title" placeholder="My First Post" />

  <label>Content:</label>
  <textarea id="content" rows="10" placeholder="Write your content here..."></textarea>

  <label>Type:</label>
  <select id="type">
    <option value="posts">Post</option>
    <option value="extras">Extra</option>
  </select>

  <button onclick="uploadFile()">Upload</button>

  <p id="status"></p>

  <script>
    async function uploadFile() {
      const token = document.getElementById('token').value.trim();
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value;
      const type = document.getElementById('type').value;
      const status = document.getElementById('status');

      status.textContent = "";

      if (!token || !title || !content) {
        status.textContent = "All fields are required.";
        status.className = "error";
        return;
      }

      const username = "tug-g"; 
      const repo = "tug-g.github.io"; 
      const branch = "main";

      const path = `${type}/${title.replace(/\s+/g, '-').toLowerCase()}.md`;
      const url = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;

      const encoded = btoa(unescape(encodeURIComponent(content)));

      const body = {
        message: `Add ${type} → ${title}`,
        content: encoded,
        branch: branch
      };

      try {
        const res = await fetch(url, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const err = await res.json();
          status.textContent = "Error: " + (err.message || res.statusText);
          status.className = "error";
          return;
        }

        status.textContent = "Upload successful!";
        status.className = "success";

      } catch (error) {
        status.textContent = "Network error: " + error;
        status.className = "error";
      }
    }
  </script>
</body>
</html>
