<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Blog</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>Estariot</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#posts">Posts</a>
            <a href="#extras">Extras</a>
        </nav>
    </header>

    <main>
        <section id="home" class="home-intro">
            <h2>Welcome</h2>
            <p>This blog shares posts and extra content. Explore the latest updates below.</p>
            <div class="intro-buttons">
                <a class="btn" id="latest-post-btn">Latest Post</a>
                <a class="btn" id="latest-extra-btn">Latest Extra</a>
            </div>
        </section>

        <section id="posts" class="content-section">
            <h2>Posts</h2>
            <div id="posts-container"></div>
        </section>

        <section id="extras" class="content-section">
            <h2>Extras</h2>
            <div id="extras-container"></div>
        </section>
    </main>

    <footer>
        <p>Estariot</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
